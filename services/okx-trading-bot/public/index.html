<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OKX paper trading bot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --up: #22c55e;
        --down: #ef4444;
        --neu: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 1rem;
        min-height: 100vh;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-start;
      }
      .card {
        background: var(--card);
        border-radius: 8px;
        padding: 1rem;
        flex: 1 1 320px;
        max-width: 100%;
      }
      .token-bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 1rem;
      }
      .token-bar input {
        flex: 1 1 220px;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #0f172a;
        color: var(--text);
      }
      button {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: 0;
        background: #3b82f6;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .pill {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .pill.up {
        background: rgba(34, 197, 94, 0.2);
        color: var(--up);
      }
      .pill.down {
        background: rgba(239, 68, 68, 0.2);
        color: var(--down);
      }
      .pill.neu {
        background: rgba(148, 163, 184, 0.2);
        color: var(--neu);
      }
      .mono {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 180px;
        overflow: auto;
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.35rem 0.5rem;
        border-bottom: 1px solid #334155;
      }
      .err {
        color: #f87171;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>OKX paper bot</h1>
    <p style="color: var(--muted); margin: 0 0 1rem; font-size: 0.9rem">
      Set <code>BOT_ADMIN_TOKEN</code> on the server, then paste the same value here. Data is
      not financial advice.
    </p>
    <div class="token-bar">
      <input
        type="password"
        id="token"
        placeholder="Admin token (Bearer)"
        autocomplete="off"
      />
      <button type="button" id="save">Save &amp; load</button>
    </div>
    <p id="err" class="err" style="display: none"></p>

    <div class="row">
      <div class="card" style="flex: 2 1 480px">
        <h2 style="margin: 0 0 0.5rem; font-size: 1rem">Close price</h2>
        <canvas id="chart" height="120"></canvas>
      </div>
      <div class="card">
        <h2 style="margin: 0 0 0.5rem; font-size: 1rem">Last tick</h2>
        <div id="summary">No data yet.</div>
      </div>
    </div>
    <div class="row" style="margin-top: 1rem">
      <div class="card">
        <h2 style="margin: 0 0 0.5rem; font-size: 1rem">Paper state</h2>
        <div id="paper" class="mono">—</div>
      </div>
      <div class="card">
        <h2 style="margin: 0 0 0.5rem; font-size: 1rem">Signal</h2>
        <div id="sig" class="mono">—</div>
      </div>
    </div>
    <div class="row" style="margin-top: 1rem">
      <div class="card" style="flex: 1 1 100%">
        <h2 style="margin: 0 0 0.5rem; font-size: 1rem">Recent orders</h2>
        <div style="overflow: auto">
          <table>
            <thead>
              <tr>
                <th>id</th>
                <th>side</th>
                <th>qty</th>
                <th>status</th>
                <th>fill</th>
                <th>time</th>
              </tr>
            </thead>
            <tbody id="ord"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top: 1rem">
      <div class="card" style="flex: 1 1 100%">
        <h2 style="margin: 0 0 0.5rem; font-size: 1rem">Log tail</h2>
        <div id="logs" class="mono"></div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const fromQuery = params.get("token");
      if (fromQuery) {
        sessionStorage.setItem("okxBotToken", fromQuery);
        history.replaceState(null, "", window.location.pathname);
      }
      const stored = sessionStorage.getItem("okxBotToken");
      if (stored) document.getElementById("token").value = stored;

      const errEl = document.getElementById("err");
      function showErr(m) {
        errEl.style.display = m ? "block" : "none";
        errEl.textContent = m || "";
      }

      const ctx = document.getElementById("chart");
      const chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "Close",
              data: [],
              borderColor: "#60a5fa",
              tension: 0.1,
              pointRadius: 0,
            },
          ],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: true, ticks: { color: "#94a3b8", maxTicksLimit: 8 } },
            y: { display: true, ticks: { color: "#94a3b8" } },
          },
        },
      });

      async function api(path, token) {
        const r = await fetch(path, {
          headers: { Authorization: "Bearer " + token },
        });
        if (!r.ok) {
          const t = await r.text();
          throw new Error(t || r.status);
        }
        return r.json();
      }

      async function refresh() {
        const token = document.getElementById("token").value.trim();
        if (!token) {
          showErr("Enter admin token.");
          return;
        }
        showErr("");
        try {
          const [st, or] = await Promise.all([
            api("/api/status", token),
            api("/api/orders?limit=30", token),
          ]);
          const snap = st.snapshot;
          if (!snap) {
            document.getElementById("summary").textContent = "Waiting for first bot tick…";
            return;
          }
          const c = snap.candles || [];
          const labels = c.map((x) => {
            const d = new Date(x.ts);
            return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
          });
          const closes = c.map((x) => x.close);
          chart.data.labels = labels;
          chart.data.datasets[0].data = closes;
          chart.update("none");

          const d = snap.signal.direction;
          const pill =
            d === "UP" ? "up" : d === "DOWN" ? "down" : "neu";
          document.getElementById("summary").innerHTML =
            "<div><strong>" +
            snap.instId +
            "</strong> &nbsp; last <strong>" +
            snap.ticker.last.toFixed(2) +
            "</strong></div>" +
            '<div style="margin-top:0.5rem">Signal: <span class="pill ' +
            pill +
            '">' +
            d +
            "</span> conf " +
            (snap.signal.confidence * 100).toFixed(0) +
            "%</div>" +
            "<div style='margin-top:0.35rem;color:var(--muted);font-size:0.85rem'>" +
            (snap.signal.reasons || []).join(" · ") +
            "</div>";

          const p = snap.paper;
          document.getElementById("paper").textContent = JSON.stringify(
            {
              cash: p.state.cashUsdt,
              position: p.state.positionQty,
              avgEntry: p.state.avgEntry,
              equity: p.equity,
              actions: p.actions,
            },
            null,
            2
          );
          document.getElementById("sig").textContent = JSON.stringify(snap.signal, null, 2);
          document.getElementById("logs").textContent = (st.logsTail || []).join("\n");

          const tbody = document.getElementById("ord");
          tbody.innerHTML = "";
          for (const o of or.orders || []) {
            const tr = document.createElement("tr");
            tr.innerHTML =
              "<td>" +
              o.id +
              "</td><td>" +
              o.side +
              "</td><td>" +
              o.qty +
              "</td><td>" +
              o.status +
              "</td><td>" +
              (o.fill_price ?? "—") +
              "</td><td>" +
              (o.filled_at || o.created_at) +
              "</td>";
            tbody.appendChild(tr);
          }
        } catch (e) {
          showErr(String(e.message || e));
        }
      }

      document.getElementById("save").onclick = () => {
        sessionStorage.setItem("okxBotToken", document.getElementById("token").value.trim());
        refresh();
      };
      setInterval(refresh, 5000);
      if (stored || fromQuery) refresh();
    </script>
  </body>
</html>
