server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter web app-shell must be revalidated so homescreen PWAs pick up releases.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /flutter_bootstrap.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /flutter.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /main.dart.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /version.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /AssetManifest.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /FontManifest.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Compatibility aliases for old/wrong asset paths.
    location ^~ /assets/images/ {
        alias /usr/share/nginx/html/assets/assets/images/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /assets/image/ {
        alias /usr/share/nginx/html/assets/assets/images/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Stable public image route for gameplay modules.
    # First try externally mounted runtime images, then fall back to bundled Flutter assets.
    location ~* ^/images/(.*)$ {
        try_files /mnt/external-images/$1 /usr/share/nginx/html/assets/assets/images/$1 =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}